<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Tí</title>
    <!-- Fuentes elegantes de Google Fonts -->
    <link rel="icon" type="image/png" href="corazon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <!-- Corazones flotantes de fondo -->
    <div class="hearts-bg">
        <div class="heart">❤️</div>
        <div class="heart" style="animation-delay: 2s; left: 20%;">🖤</div>
        <div class="heart" style="animation-delay: 4s; left: 80%;">❤️</div>
        <div class="heart" style="animation-delay: 1s; left: 50%;">💕</div>
        <div class="heart" style="animation-delay: 3s; left: 90%;">🖤</div>
    </div>

    <div class="container">
        <h1 class="titulo">🥰😍 ¿Te gusto? 🥰😍</h1>

        <!-- El marco con el resplandor rojo -->
        <div class="marco-imagen">
            <img src="amour-love.gif" alt="Gatitos amor" class="gif">
        </div>

        <div class="opciones">
            <button id="btn-si" class="btn btn-si">Si 💛</button>
            <button id="btn-no" class="btn btn-no">No</button>
        </div>

        <!-- Mensaje oculto al inicio -->
        <div id="mensaje-exito" class="oculto">
            <h2>Gracias preciosa, lo sabía JAJA.💖</h2>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
